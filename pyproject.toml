[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icp-linux"
version = "0.0.1"
description = "Register as an Apple device and sync iCloud Keychain on Linux"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "srp>=1.0.20",
    "cryptography>=42.0",
    "pynacl>=1.5",
]

[project.scripts]
icp = "icp.cli.app:main"

[tool.setuptools.packages.find]
include = ["icp*"]
